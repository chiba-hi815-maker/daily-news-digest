<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日次ニュースダイジェスト</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --ink: #2b2b2b;
    --sub: #6b6b6b;
    --accent: #8a3b2f;
    --border: #e5e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    padding: 28px 20px 16px;
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
  }
  header .date {
    color: var(--sub);
    font-size: 0.95rem;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .topic {
    margin-top: 32px;
  }
  .topic h2 {
    font-size: 1.15rem;
    border-left: 5px solid var(--accent);
    padding-left: 10px;
    margin-bottom: 14px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    border-color: var(--accent);
  }
  .card-title {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 4px;
  }
  .card-meta {
    font-size: 0.8rem;
    color: var(--sub);
  }
  .empty {
    color: var(--sub);
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 0.8rem;
    padding: 20px;
  }
</style>
</head>
<body>
<header>
  <h1>日次ニュースダイジェスト</h1>
  <div class="date">2026年09月06日 (Sun) 更新</div>
</header>

</html>
